name: Check CIX source versions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare with Gentoo sources
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare maintained versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-cix-source-versions.py
