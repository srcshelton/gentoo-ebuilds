name: Build CIX kernel Debian packages

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cix-kernel-debs.yml"
      - "sys-kernel/cix-sources/**"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cix-kernel-debs.yml"
      - "sys-kernel/cix-sources/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a draft GitHub Release containing the built .deb files"
        required: false
        type: boolean
        default: false

concurrency:
  group: cix-kernel-debs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DISABLE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KBUILD_BUILD_USER: cix
  KBUILD_BUILD_HOST: github-actions

jobs:
  discover:
    name: Select latest cix-sources ebuilds
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      ubuntu_config_matrix: ${{ steps.matrix.outputs.ubuntu_config_matrix }}
      validation_matrix: ${{ steps.matrix.outputs.validation_matrix }}
    steps:
      - name: Check out overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build matrix
        id: matrix
        shell: bash
        run: .github/scripts/discover-cix-matrix.py --github-output "${GITHUB_OUTPUT}"

  preflight:
    name: Validate workflow helpers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: debian:trixie-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2
    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            python3-yaml \
            shellcheck
          rm -rf /var/lib/apt/lists/*

      - name: Check out overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate YAML, Python, and shell
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path(".github/workflows/cix-kernel-debs.yml")
          parsed = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          if not isinstance(parsed, dict) or "jobs" not in parsed:
              raise SystemExit(f"{workflow}: missing jobs mapping")

          package = Path("sys-kernel/cix-sources")
          for ebuild in package.glob("cix-sources-*.ebuild"):
              text = ebuild.read_text(encoding="utf-8")
              if "EGIT_SKY1" in text or "Sky1-Linux/linux-sky1" in text:
                  raise SystemExit(
                      f"{ebuild}: external Sky1 patch layer was reintroduced"
                  )
          manifest = (package / "Manifest").read_text(encoding="utf-8")
          if any(
              line.startswith("DIST cix-sources-sky1-")
              for line in manifest.splitlines()
          ):
              raise SystemExit("Manifest retains the removed Sky1 archive")
          PY

          bash -n \
            .github/scripts/fetch-ubuntu-configs.sh \
            .github/scripts/validate-cix-configs.sh \
            .github/scripts/cix-headers/validate-cix-headers.sh \
            .github/scripts/cix-sources/check-retained-inputs.sh \
            .github/scripts/cix-sources/create-patched-kernel.sh \
            .github/scripts/cix-sources/validate-cix-uapi.sh
          bash -n \
            sys-kernel/cix-headers/cix-headers-*.ebuild \
            sys-kernel/cix-sources/cix-sources-*.ebuild
          shellcheck \
            .github/scripts/fetch-ubuntu-configs.sh \
            .github/scripts/validate-cix-configs.sh \
            .github/scripts/cix-headers/validate-cix-headers.sh \
            .github/scripts/cix-sources/check-retained-inputs.sh \
            .github/scripts/cix-sources/create-patched-kernel.sh \
            .github/scripts/cix-sources/validate-cix-uapi.sh
          python3 -m py_compile \
            .github/scripts/discover-cix-matrix.py \
            .github/scripts/test-kconfig-update.py \
            sys-kernel/cix-sources/files/kconfig_update.py
          python3 .github/scripts/test-kconfig-update.py

          matrix_json=$(mktemp)
          trap 'rm -f "${matrix_json}"' EXIT
          .github/scripts/discover-cix-matrix.py > "${matrix_json}"
          python3 - "${matrix_json}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as matrix_file:
              matrices = json.load(matrix_file)

          versions = {
              entry["line"]: entry["version"]
              for entry in matrices["validation"]["include"]
          }
          expected_seeds = {
              "6.18": "6.17",
              "7.0": "7.0",
              "7.1": "7.0",
          }
          expected_artifacts = {
              "6.17": "cix-ubuntu-config-6.17",
              "7.0": "cix-ubuntu-config-7.0",
          }
          validation_seeds = {
              entry["line"]: entry["ubuntu_config_seed"]
              for entry in matrices["validation"]["include"]
          }
          if versions.keys() != expected_seeds.keys():
              raise SystemExit(f"unexpected retained lines: {versions}")
          if validation_seeds != expected_seeds:
              raise SystemExit(
                  f"unexpected Ubuntu config seed mapping: {validation_seeds}"
              )

          build = matrices["build"]["include"]
          signatures = {
              (
                  entry["line"],
                  entry["board_profile"],
                  entry["firmware"],
                  entry["config_flavour"],
              )
              for entry in build
          }
          if len(build) != 24 or len(signatures) != 24:
              raise SystemExit("build matrix does not cover every board/profile/flavour")
          if any(
              entry["ubuntu_config_seed"] != expected_seeds[entry["line"]]
              or entry["ubuntu_config_artifact"]
              != expected_artifacts[entry["ubuntu_config_seed"]]
              for entry in build
          ):
              raise SystemExit(
                  "build matrix has an inconsistent Ubuntu config seed/artifact"
              )

          ubuntu_configs = matrices["ubuntu_config"]["include"]
          expected_configs = [
              {"seed": "6.17", "artifact": "cix-ubuntu-config-6.17"},
              {"seed": "7.0", "artifact": "cix-ubuntu-config-7.0"},
          ]
          if ubuntu_configs != expected_configs:
              raise SystemExit(
                  f"unexpected Ubuntu config export matrix: {ubuntu_configs}"
              )
          print("retained CIX source lines:", versions)
          print("Ubuntu adjacent config seeds:", validation_seeds)
          PY

  ubuntu-configs:
    name: Freeze Ubuntu ${{ matrix.seed }} arm64 configs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs:
      - discover
      - preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.discover.outputs.ubuntu_config_matrix) }}
    env:
      UBUNTU_CONFIG_SEED: ${{ matrix.seed }}
    steps:
      - name: Check out overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Export official Ubuntu arm64 configs
        shell: bash
        run: |
          set -euo pipefail

          git --version
          python3 --version
          timeout --version | sed -n '1p'
          .github/scripts/fetch-ubuntu-configs.sh \
            --seed "${UBUNTU_CONFIG_SEED}" \
            --output-dir "${GITHUB_WORKSPACE}/artifacts/ubuntu-configs/${UBUNTU_CONFIG_SEED}" \
            --work-dir "${RUNNER_TEMP}/ubuntu-config-${UBUNTU_CONFIG_SEED}"

      - name: Verify and record frozen config provenance
        shell: bash
        run: |
          set -euo pipefail

          config_dir="${GITHUB_WORKSPACE}/artifacts/ubuntu-configs/${UBUNTU_CONFIG_SEED}"
          python3 - \
            "${config_dir}/metadata.json" \
            "${config_dir}" \
            "${UBUNTU_CONFIG_SEED}" \
            "${GITHUB_STEP_SUMMARY}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          config_dir = Path(sys.argv[2])
          expected_seed = sys.argv[3]
          summary_path = Path(sys.argv[4])
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))

          if metadata["declared_seed"] != expected_seed:
              raise SystemExit(
                  f"metadata seed {metadata['declared_seed']} != {expected_seed}"
              )
          if metadata["source_kernel_series"] != expected_seed:
              raise SystemExit(
                  "resolved Ubuntu kernel series does not match the declared seed"
              )
          for name, record in metadata["configs"].items():
              path = config_dir / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != record["sha256"]:
                  raise SystemExit(
                      f"{name}: sha256 {digest} != {record['sha256']}"
                  )

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("### Frozen Ubuntu kernel configuration\n\n")
              summary.write(f"- Source: {metadata['source']}\n")
              summary.write(f"- Repository: `{metadata['repository']}`\n")
              summary.write(f"- Requested ref: `{metadata['requested_ref']}`\n")
              summary.write(f"- Resolved commit: `{metadata['resolved_commit']}`\n")
              summary.write(
                  f"- Resolved commit date: `{metadata['resolved_commit_date']}`\n"
              )
              summary.write(
                  f"- Declared adjacent seed: `{metadata['declared_seed']}` "
                  f"(source `{metadata['source_kernel_version']}`)\n"
              )
              summary.write(
                  f"- Debian packaging directory: "
                  f"`{metadata['debian_directory']}`\n"
              )
              summary.write(f"- Scope: {metadata['compatibility_note']}\n")
              for name, record in metadata["configs"].items():
                  summary.write(
                      f"- `{name}`: `{record['sha256']}` "
                      f"({record['lines']} lines)\n"
                  )
          PY

      - name: Upload frozen Ubuntu configs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/ubuntu-configs/${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 14

  source-validation:
    name: Validate ${{ matrix.version }} CIX configs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    needs:
      - discover
      - preflight
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.validation_matrix) }}
    container:
      image: debian:trixie-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2
    env:
      KERNEL_EBUILD: ${{ matrix.ebuild }}
      KERNEL_LINE: ${{ matrix.line }}
      KERNEL_VERSION: ${{ matrix.version }}
      NPU_ABI: ${{ matrix.npu_abi }}
      UAPI_PREIMAGE_BOUNDARY: ${{ matrix.uapi_preimage_boundary }}
    steps:
      - name: Install prepare and focused-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            clang \
            curl \
            flex \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            xz-utils \
            zstd
          rm -rf /var/lib/apt/lists/*

      - name: Check out overlay with provenance history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Record validation environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          clang --version
          ld.lld --version
          make --version | head -1
          python3 --version

      - name: Prepare the ebuild source and exercise CIX configurations
        shell: bash
        run: |
          set -euo pipefail

          work_root="${RUNNER_TEMP}/cix-validation-${KERNEL_VERSION}"
          source_dir="${work_root}/linux-${KERNEL_LINE}"
          uapi_preimage_dir="${work_root}/linux-${KERNEL_LINE}-pre-overlay"
          build_root="${work_root}/build"
          distdir="${RUNNER_TEMP}/cix-distfiles-${KERNEL_VERSION}"
          trap 'rm -rf "${work_root}" "${distdir}"' EXIT

          .github/scripts/cix-sources/create-patched-kernel.sh \
            --force \
            --work-dir "${work_root}/prepare" \
            --distdir "${distdir}" \
            "${KERNEL_EBUILD}" \
            "${source_dir}"

          .github/scripts/cix-sources/create-patched-kernel.sh \
            --force \
            --stop-before-patch "${UAPI_PREIMAGE_BOUNDARY}" \
            --work-dir "${work_root}/prepare-pre-overlay" \
            --distdir "${distdir}" \
            "${KERNEL_EBUILD}" \
            "${uapi_preimage_dir}"
          expected_uapi=()
          [[ ${KERNEL_LINE} != 7.1 ]] || expected_uapi=(
            sys-kernel/cix-headers/files/7.1-cix-sof-topology-tokens.patch
          )
          .github/scripts/cix-sources/validate-cix-uapi.sh \
            "${uapi_preimage_dir}" \
            "${source_dir}" \
            "${work_root}/uapi" \
            "${expected_uapi[@]}"

          rm -rf "${work_root}/prepare"
          .github/scripts/validate-cix-configs.sh \
            "${source_dir}" \
            "${build_root}" \
            "${KERNEL_LINE}" \
            "${NPU_ABI}"

  build:
    name: Build ${{ matrix.version }} ${{ matrix.board_profile }} ${{ matrix.config_flavour }} firmware ${{ matrix.firmware }} debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    needs:
      - discover
      - preflight
      - ubuntu-configs
      - source-validation
    if: ${{ needs.discover.outputs.build_matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    env:
      KERNEL_EBUILD: ${{ matrix.ebuild }}
      KERNEL_LINE: ${{ matrix.line }}
      KERNEL_PV: ${{ matrix.pv }}
      KERNEL_PR: ${{ matrix.pr }}
      KERNEL_VERSION: ${{ matrix.version }}
      BOARD_PROFILE: ${{ matrix.board_profile }}
      BOARD_PACKAGE: ${{ matrix.board_package }}
      BOARD_VERSION: ${{ matrix.board_version }}
      FIRMWARE_PROFILE: ${{ matrix.firmware }}
      ACPI_TABLE_UPGRADE_MODE: ${{ matrix.acpi_table_upgrade }}
      ACPI_INITRAMFS_PROFILE: ${{ matrix.acpi_initramfs_profile }}
      KERNEL_CONFIG_FLAVOUR: ${{ matrix.config_flavour }}
      NPU_ABI: ${{ matrix.npu_abi }}
      UBUNTU_CONFIG_SEED: ${{ matrix.ubuntu_config_seed }}
    steps:
      - name: Check out overlay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reclaim runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download frozen Ubuntu arm64 configs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.ubuntu_config_artifact }}
          path: ${{ runner.temp }}/ubuntu-config-${{ matrix.ubuntu_config_seed }}

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt_options=(
            -o Acquire::Retries=5
            -o Acquire::http::No-Cache=true
            -o Acquire::https::No-Cache=true
            -o Dpkg::Use-Pty=0
          )

          disable_third_party_apt_sources() {
            local source

            shopt -s nullglob
            for source in /etc/apt/sources.list.d/*; do
              case "$(basename "${source}")" in
                ubuntu.sources|ubuntu.list)
                  continue
                  ;;
              esac

              echo "Disabling non-Ubuntu apt source ${source}"
              sudo mv "${source}" "${source}.disabled"
            done
            shopt -u nullglob
          }

          apt_get_update() {
            local attempt

            for attempt in 1 2 3; do
              if sudo apt-get "${apt_options[@]}" update; then
                return 0
              fi

              echo "::warning::apt-get update failed on attempt ${attempt}; retrying with fresh package lists"
              sudo apt-get clean
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$((attempt * 10))"
            done

            sudo apt-get "${apt_options[@]}" update
          }

          apt_get_install() {
            local attempt

            for attempt in 1 2 3; do
              if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$@"; then
                return 0
              fi

              echo "::warning::apt-get install failed on attempt ${attempt}; refreshing package lists before retrying"
              sudo apt-get clean
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$((attempt * 10))"
              apt_get_update
            done

            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "$@"
          }

          disable_third_party_apt_sources
          apt_get_update
          apt_get_install \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            debhelper-compat \
            dwarves \
            fakeroot \
            flex \
            git \
            kmod \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            lsb-release \
            openssl \
            patch \
            python3 \
            rsync \
            xz-utils \
            zstd

          gcc_major="$(gcc -dumpversion | cut -d. -f1)"
          apt_get_install "gcc-${gcc_major}-plugin-dev" || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install current ACPICA iasl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          acpica_url=
          acpica_archive=
          if curl -fL --retry 5 --retry-connrefused --connect-timeout 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output "${RUNNER_TEMP}/acpica-latest-release.json" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/acpica/acpica/releases/latest"; then
            if ! read -r acpica_url acpica_archive < <(
              python3 - "${RUNNER_TEMP}/acpica-latest-release.json" <<'PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as release_file:
                  release = json.load(release_file)
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)

          for asset in release.get("assets", []):
              if re.fullmatch(r"acpica-unix-\d{8}\.tar\.gz", asset.get("name", "")):
                  print(asset["browser_download_url"], asset["name"])
                  break
          else:
              raise SystemExit(1)
          PY
            ); then
              echo "::warning::Latest ACPICA release metadata did not include an acpica-unix source asset; using fallback release"
            fi
          else
            echo "::warning::Unable to query latest ACPICA release; using fallback release"
          fi

          if [[ -z "${acpica_url}" || -z "${acpica_archive}" ]]; then
            acpica_url="https://github.com/acpica/acpica/releases/download/20260408/acpica-unix-20260408.tar.gz"
            acpica_archive="${acpica_url##*/}"
          fi
          acpica_version="${acpica_archive#acpica-unix-}"
          acpica_version="${acpica_version%.tar.gz}"

          echo "Building ACPICA iasl ${acpica_version}"
          curl -fL --retry 5 --retry-connrefused --connect-timeout 30 \
            --output "${RUNNER_TEMP}/${acpica_archive}" \
            "${acpica_url}"

          mkdir -p "${RUNNER_TEMP}/acpica-${acpica_version}"
          tar -xf "${RUNNER_TEMP}/${acpica_archive}" \
            -C "${RUNNER_TEMP}/acpica-${acpica_version}" \
            --strip-components=1
          make -C "${RUNNER_TEMP}/acpica-${acpica_version}" iasl
          sudo install -m 0755 \
            "${RUNNER_TEMP}/acpica-${acpica_version}/generate/unix/bin/iasl" \
            /usr/local/bin/iasl
          iasl -v

      - name: Prepare patched kernel source from ebuild
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          work_root="${RUNNER_TEMP}/cix-kernel-${KERNEL_VERSION}-${BOARD_PACKAGE}"
          source_dir="${work_root}/source/linux-${KERNEL_LINE}"
          build_dir="${work_root}/build"

          rm -rf "${work_root}"
          mkdir -p "${build_dir}"

          .github/scripts/cix-sources/create-patched-kernel.sh \
            --force \
            --compile-acpi-tables \
            --acpi-table-profile "${ACPI_TABLE_UPGRADE_MODE}" \
            --board-profile "${BOARD_PROFILE}" \
            --firmware "${FIRMWARE_PROFILE}" \
            --work-dir "${work_root}/prepare" \
            --distdir "${work_root}/distfiles" \
            "${KERNEL_EBUILD}" \
            "${source_dir}"

          acpi_table_upgrade_initramfs_source=""
          if [[ "${BOARD_PROFILE}" == "o6-acpi" || "${BOARD_PROFILE}" == "o6n-acpi" ]]; then
            board="${BOARD_PROFILE%%-*}"
            acpi_table_upgrade_initramfs_source="${source_dir}/cix-acpi-table-upgrade/${board}/${FIRMWARE_PROFILE}/${ACPI_INITRAMFS_PROFILE}.list"
            acpi_table_upgrade_dir="${source_dir}/cix-acpi-table-upgrade/${board}/${FIRMWARE_PROFILE}/${ACPI_INITRAMFS_PROFILE}/kernel/firmware/acpi"

            test -s "${acpi_table_upgrade_initramfs_source}"
            test -n "$(find "${acpi_table_upgrade_dir}" -maxdepth 1 -type f -name '*.aml' -print -quit)"
          fi

          rm -rf "${work_root}/distfiles" "${work_root}/prepare"

          {
            echo "work_root=${work_root}"
            echo "source_dir=${source_dir}"
            echo "build_dir=${build_dir}"
            echo "acpi_table_upgrade_initramfs_source=${acpi_table_upgrade_initramfs_source}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply frozen Ubuntu arm64 config and Radxa updates
        shell: bash
        run: |
          set -euo pipefail

          source_dir="${{ steps.prepare.outputs.source_dir }}"
          build_dir="${{ steps.prepare.outputs.build_dir }}"
          ubuntu_config_dir="${RUNNER_TEMP}/ubuntu-config-${UBUNTU_CONFIG_SEED}"
          ubuntu_config_source="${ubuntu_config_dir}/arm64-${KERNEL_CONFIG_FLAVOUR}.config"
          ubuntu_config_metadata="${ubuntu_config_dir}/metadata.json"
          ubuntu_config="${build_dir}/.config"

          python3 - \
            "${ubuntu_config_metadata}" \
            "${ubuntu_config_source}" \
            "${UBUNTU_CONFIG_SEED}" \
            "${KERNEL_LINE}" \
            "${KERNEL_CONFIG_FLAVOUR}" \
            "${GITHUB_STEP_SUMMARY}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          config_path = Path(sys.argv[2])
          expected_seed = sys.argv[3]
          kernel_line = sys.argv[4]
          flavour = sys.argv[5]
          summary_path = Path(sys.argv[6])
          expected_seed_by_line = {
              "6.18": "6.17",
              "7.0": "7.0",
              "7.1": "7.0",
          }

          if expected_seed_by_line.get(kernel_line) != expected_seed:
              raise SystemExit(
                  f"Linux {kernel_line} must use Ubuntu seed "
                  f"{expected_seed_by_line.get(kernel_line)}, not {expected_seed}"
              )
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata["declared_seed"] != expected_seed:
              raise SystemExit("downloaded Ubuntu config metadata has the wrong seed")
          if metadata["source_kernel_series"] != expected_seed:
              raise SystemExit("downloaded Ubuntu config has the wrong kernel series")
          if kernel_line not in metadata["consumer_lines"]:
              raise SystemExit(
                  f"Ubuntu config seed {expected_seed} does not declare Linux "
                  f"{kernel_line} as a consumer"
              )

          config_name = f"arm64-{flavour}.config"
          if config_path.name != config_name:
              raise SystemExit(f"unexpected Ubuntu config filename: {config_path}")
          digest = hashlib.sha256(config_path.read_bytes()).hexdigest()
          expected_digest = metadata["configs"][config_name]["sha256"]
          if digest != expected_digest:
              raise SystemExit(
                  f"{config_name}: sha256 {digest} != {expected_digest}"
              )

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("### Ubuntu kernel configuration input\n\n")
              summary.write(f"- Source: {metadata['source']}\n")
              summary.write(f"- Repository: `{metadata['repository']}`\n")
              summary.write(f"- Requested ref: `{metadata['requested_ref']}`\n")
              summary.write(f"- Resolved commit: `{metadata['resolved_commit']}`\n")
              summary.write(
                  f"- Resolved commit date: `{metadata['resolved_commit_date']}`\n"
              )
              summary.write(
                  f"- Ubuntu seed/source version: "
                  f"`{metadata['declared_seed']}` / "
                  f"`{metadata['source_kernel_version']}`\n"
              )
              summary.write(f"- Target CIX line: `{kernel_line}`\n")
              summary.write(f"- Architecture/flavour: `arm64/{flavour}`\n")
              summary.write(
                  f"- Debian packaging directory: "
                  f"`{metadata['debian_directory']}`\n"
              )
              summary.write(f"- Scope: {metadata['compatibility_note']}\n")
              summary.write(f"- Frozen config SHA-256: `{digest}`\n")
          PY

          install -m 0644 "${ubuntu_config_source}" "${ubuntu_config}"

          acpi_table_upgrade_initramfs_source="${{ steps.prepare.outputs.acpi_table_upgrade_initramfs_source }}"
          kconfig_update_args=(
            --mode update
            --kernel-tree "${source_dir}"
            --board-profile "${BOARD_PROFILE}"
            --hardware-profile full
            --cix-patches yes
            --with-npu
            --require-npu-abi "${NPU_ABI}"
            --apply
          )
          if [[ -n "${acpi_table_upgrade_initramfs_source}" ]]; then
            kconfig_update_args+=(
              --firmware "${FIRMWARE_PROFILE}"
              --acpi-table-upgrade "${ACPI_TABLE_UPGRADE_MODE}"
              --acpi-table-upgrade-initramfs-source "${acpi_table_upgrade_initramfs_source}"
            )
          fi

          python3 "${GITHUB_WORKSPACE}/sys-kernel/cix-sources/files/kconfig_update.py" \
            "${kconfig_update_args[@]}" \
            "${build_dir}/.config"

          "${source_dir}/scripts/config" --file "${build_dir}/.config" \
            --disable DEBUG_INFO \
            --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            --disable DEBUG_INFO_DWARF4 \
            --disable DEBUG_INFO_DWARF5 \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO_BTF_MODULES \
            --disable DEBUG_INFO_REDUCED \
            --enable DEBUG_INFO_NONE \
            --set-str SYSTEM_TRUSTED_KEYS "" \
            --set-str SYSTEM_REVOCATION_KEYS ""

          make -C "${source_dir}" O="${build_dir}" ARCH=arm64 olddefconfig

          require_config() {
            local expected=$1

            if ! grep -qxF "${expected}" "${build_dir}/.config"; then
              echo "Resolved Ubuntu config is missing required ${expected}" >&2
              exit 1
            fi
          }

          require_enabled_config() {
            local symbol=$1

            if ! grep -Eq "^CONFIG_${symbol}=[ym]$" "${build_dir}/.config"; then
              echo "Resolved Ubuntu config does not enable CONFIG_${symbol}" >&2
              exit 1
            fi
          }

          reject_enabled_config() {
            local symbol=$1

            if grep -Eq "^CONFIG_${symbol}=[ym]$" "${build_dir}/.config"; then
              echo "Resolved Ubuntu config unexpectedly enables CONFIG_${symbol}" >&2
              exit 1
            fi
          }

          case "${BOARD_PROFILE}" in
            o6-acpi)
              board_symbol=CIX_RADXA_ORION_O6
              opposite_board_symbol=CIX_RADXA_ORION_O6N
              ethernet_symbol=R8126
              opposite_ethernet_symbol=R8169
              ;;
            o6n-acpi)
              board_symbol=CIX_RADXA_ORION_O6N
              opposite_board_symbol=CIX_RADXA_ORION_O6
              ethernet_symbol=R8169
              opposite_ethernet_symbol=R8126
              ;;
            *)
              echo "Unsupported package-build board profile: ${BOARD_PROFILE}" >&2
              exit 1
              ;;
          esac

          for expected in \
            CONFIG_ARCH_CIX=y \
            "CONFIG_${board_symbol}=y" \
            CONFIG_CIX_RADXA_ORION_ACPI=y \
            CONFIG_CIX_RADXA_ESSENTIAL=y \
            CONFIG_CIX_RADXA_OPTIONAL_ACCELERATORS=m \
            CONFIG_DMA_SHARED_BUFFER=y \
            CONFIG_I2C=y \
            CONFIG_PM=y \
            CONFIG_PM_SLEEP=y \
            CONFIG_PM_SLEEP_SMP=y \
            CONFIG_SUSPEND=y \
            CONFIG_SUSPEND_FREEZER=y \
            CONFIG_RESET_CONTROLLER=y \
            CONFIG_COMMON_CLK=y \
            CONFIG_REGULATOR=y \
            CONFIG_PM_DEVFREQ=y \
            CONFIG_DEVFREQ_GOV_USERSPACE=m \
            CONFIG_ARMCHINA_NPU=m \
            CONFIG_ARMCHINA_NPU_R2P0=m \
            CONFIG_ARMCHINA_NPU_ARCH_V3=y \
            CONFIG_ARMCHINA_NPU_SOC_SKY1=y \
            CONFIG_MEDIA_CAMERA_SUPPORT=y \
            CONFIG_MEDIA_PLATFORM_SUPPORT=y \
            CONFIG_MEDIA_PLATFORM_DRIVERS=y \
            CONFIG_MEDIA_CONTROLLER=y \
            CONFIG_VIDEO_LINLON=m \
            CONFIG_VIDEO_CIX_ARMCB_ISP=m \
            CONFIG_THERMAL=y \
            CONFIG_THERMAL_GOV_POWER_ALLOCATOR=y \
            CONFIG_THERMAL_GOV_STEP_WISE=y \
            CONFIG_CPU_FREQ=y \
            CONFIG_ENERGY_MODEL=y \
            CONFIG_ACPI_PROCESSOR=y \
            CONFIG_ACPI_CPPC_CPUFREQ=y \
            "CONFIG_${ethernet_symbol}=m" \
            CONFIG_CIX_THERMAL=y; do
            require_config "${expected}"
          done
          for symbol in \
            REGULATOR_FIXED_VOLTAGE \
            MEDIA_SUPPORT \
            VIDEO_DEV \
            ACPI_THERMAL; do
            require_enabled_config "${symbol}"
          done
          for symbol in \
            "${opposite_board_symbol}" \
            CIX_RADXA_ORION_DT \
            ARMCHINA_NPU_ARCH_V1 \
            ARMCHINA_NPU_ARCH_V2 \
            ARMCHINA_NPU_ARCH_V3_2 \
            ARMCHINA_NPU_SOC_DEFAULT \
            ARMCHINA_NPU_SOC_R329 \
            CIX_SCMI_ENERGY_MODEL \
            "${opposite_ethernet_symbol}"; do
            reject_enabled_config "${symbol}"
          done

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail

          source_dir="${{ steps.prepare.outputs.source_dir }}"
          build_dir="${{ steps.prepare.outputs.build_dir }}"
          work_root="${{ steps.prepare.outputs.work_root }}"
          artifact_dir="${GITHUB_WORKSPACE}/artifacts/${KERNEL_VERSION}-${BOARD_PACKAGE}"

          mkdir -p "${artifact_dir}"

          make -C "${source_dir}" \
            O="${build_dir}" \
            ARCH=arm64 \
            LOCALVERSION="-cix-${BOARD_PACKAGE}" \
            KDEB_SOURCENAME="linux-cix-${BOARD_PACKAGE}" \
            KDEB_PKGVERSION="${KERNEL_PV}+cix.${KERNEL_PR}.${BOARD_VERSION}" \
            -j"$(nproc)" \
            bindeb-pkg

          find "${work_root}" -maxdepth 2 -type f -name "*.deb" -print -exec mv {} "${artifact_dir}/" \;

          shopt -s nullglob
          image_debs=( "${artifact_dir}"/linux-image-*cix-"${BOARD_PACKAGE}"*.deb )
          shopt -u nullglob
          if (( ${#image_debs[@]} == 0 )); then
            echo "No linux-image package found for ${BOARD_PACKAGE}" >&2
            exit 1
          fi

          for image_deb in "${image_debs[@]}"; do
            package_root="$(mktemp -d "${RUNNER_TEMP}/linux-image-deb.XXXXXX")"
            dpkg-deb -R "${image_deb}" "${package_root}"

            install -D -m 0755 \
              "${GITHUB_WORKSPACE}/sys-kernel/cix-sources/files/kconfig_update.py" \
              "${package_root}/usr/local/bin/kconfig_update.py"

            python3 - "${package_root}/DEBIAN/control" <<'PY'
          import sys
          from pathlib import Path

          control = Path(sys.argv[1])
          required_depends = ("kmod", "linux-base", "initramfs-tools | linux-initramfs-tool")
          lines = control.read_text(encoding="utf-8").splitlines()

          for index, line in enumerate(lines):
              if not line.startswith("Depends:"):
                  continue

              existing = line[len("Depends:"):].strip()
              missing = [dep for dep in required_depends if dep not in existing]
              if missing:
                  separator = ", " if existing else " "
                  lines[index] = f"{line}{separator}{', '.join(missing)}"
              break
          else:
              insert_at = 1
              for index, line in enumerate(lines):
                  if line.startswith("Architecture:"):
                      insert_at = index + 1
                      break
              lines.insert(insert_at, f"Depends: {', '.join(required_depends)}")

          control.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

            shopt -s nullglob globstar
            dtbs=( "${package_root}"/usr/lib/linux-image-*/**/*.dtb )
            if (( ${#dtbs[@]} > 0 )); then
              case "${BOARD_PROFILE}" in
                o6-dt)
                  for dtb in "${dtbs[@]}"; do
                    case "${dtb}" in
                      */usr/lib/linux-image-*/cix/sky1-orion-o6.dtb)
                        ;;
                      *)
                        rm -f "${dtb}"
                        ;;
                    esac
                  done
                  ;;
                *)
                  rm -f "${dtbs[@]}"
                  ;;
              esac
            fi
            shopt -u nullglob globstar

            find "${package_root}"/usr/lib/linux-image-* -depth -type d -empty -delete 2>/dev/null || true

            (
              cd "${package_root}"
              find . -path ./DEBIAN -prune -o -type f -print \
                | sed 's#^\./##' \
                | LC_ALL=C sort \
                | xargs -r md5sum > DEBIAN/md5sums
            )

            dpkg-deb -b "${package_root}" "${image_deb}"
            rm -rf "${package_root}"
          done

          find "${artifact_dir}" -maxdepth 1 -type f -name "*.deb" -print | sort

          test -n "$(find "${artifact_dir}" -maxdepth 1 -type f -name "linux-image-*cix-${BOARD_PACKAGE}*.deb" -print -quit)"
          test -n "$(find "${artifact_dir}" -maxdepth 1 -type f -name "linux-headers-*cix-${BOARD_PACKAGE}*.deb" -print -quit)"

          rm -rf "${source_dir}" "${build_dir}" "${work_root}"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cix-kernel-debs-${{ matrix.version }}-${{ matrix.board_package }}
          path: artifacts/${{ matrix.version }}-${{ matrix.board_package }}/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: write
    steps:
      - name: Download built package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          pattern: cix-kernel-debs-*
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: cix-kernel-debs-${{ github.run_number }}
          name: CIX kernel Debian packages ${{ github.run_number }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*.deb
